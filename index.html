    <script>
      /* 채널톡(Channel Talk) SDK */
      var CHANNEL_PLUGIN_KEY = "b065b9cc-1f27-4780-a688-7d3e28d21b67";
      (function () {
        var w = window;
        if (w.ChannelIO) {
          return w.console.error("ChannelIO script included twice.");
        }
        var ch = function () {
          ch.c(arguments);
        };
        ch.q = [];
        ch.c = function (args) {
          ch.q.push(args);
        };
        w.ChannelIO = ch;
        function l() {
          if (w.ChannelIOInitialized) {
            return;
          }
          w.ChannelIOInitialized = true;
          var s = document.createElement("script");
          s.type = "text/javascript";
          s.async = true;
          s.src = "https://cdn.channel.io/plugin/ch-plugin-web.js";
          var x = document.getElementsByTagName("script")[0];
          if (x.parentNode) {
            x.parentNode.insertBefore(s, x);
          }
        }
        if (document.readyState === "complete") {
          l();
        } else {
          w.addEventListener("DOMContentLoaded", l);
          w.addEventListener("load", l);
        }
      })();

      /* 고객 식별: 이름 + 휴대폰 번호로 memberId를 만들어 채널톡에 전달합니다.
         gorilla-ticket / gongryong-pay 와 동일한 저장 키(grpay_name, grpay_phone)와
         memberId(숫자만) · profile({name, mobileNumber}) 포맷을 사용합니다. */
      window.bootChannelAndShow = function (name, phone) {
        var digits = String(phone || "").replace(/[^0-9]/g, "");
        if (!digits) {
          try {
            ChannelIO("showMessenger");
          } catch (e) {
            console.error(e);
          }
          return;
        }
        try {
          ChannelIO("shutdown");
        } catch (e) {}
        ChannelIO(
          "boot",
          {
            pluginKey: CHANNEL_PLUGIN_KEY,
            hideChannelButtonOnBoot: true,
            memberId: digits,
            profile: { name: name || undefined, mobileNumber: digits },
          },
          function () {
            ChannelIO("showMessenger");
          }
        );
      };
    </script>
