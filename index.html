    <script>
      /* 채널톡(Channel Talk) SDK */
      var CHANNEL_PLUGIN_KEY = "b065b9cc-1f27-4780-a688-7d3e28d21b67";
      (function () {
        var w = window;
        if (w.ChannelIO) {
          return w.console.error("ChannelIO script included twice.");
        }
        var ch = function () {
          ch.c(arguments);
        };
        ch.q = [];
        ch.c = function (args) {
          ch.q.push(args);
        };
        w.ChannelIO = ch;
        function l() {
          if (w.ChannelIOInitialized) {
            return;
          }
          w.ChannelIOInitialized = true;
          var s = document.createElement("script");
          s.type = "text/javascript";
          s.async = true;
          s.src = "https://cdn.channel.io/plugin/ch-plugin-web.js";
          var x = document.getElementsByTagName("script")[0];
          if (x.parentNode) {
            x.parentNode.insertBefore(s, x);
          }
        }
        if (document.readyState === "complete") {
          l();
        } else {
          w.addEventListener("DOMContentLoaded", l);
          w.addEventListener("load", l);
        }
      })();

      /* 상담 버튼 → 채널톡 메신저 열기 (별도 정보 입력 없이 바로 상담) */
      window.openConsultChannel = function () {
        var opened = false;
        function show() {
          if (opened) return;
          opened = true;
          try {
            ChannelIO("showMessenger");
          } catch (e) {
            console.error(e);
          }
        }
        try {
          ChannelIO(
            "boot",
            { pluginKey: CHANNEL_PLUGIN_KEY, hideChannelButtonOnBoot: true },
            function () {
              show();
            }
          );
        } catch (e) {
          console.error(e);
        }
        /* SDK가 이미 부트된 경우 콜백이 오지 않을 수 있어 한 번 더 시도합니다. */
        window.setTimeout(show, 700);
      };
    </script>
